backend:
  name: turbo-github
  turbo_site_id: 0c4eecf3-167d-4cfc-ac64-435b960a6b61
  branch: main

site_url: https://corriereteatrale.it
display_url: https://corriereteatrale.it
logo_url: https://corriereteatrale.it/logo-corriere-teatrale.jpg

locale: it

media_folder: "uploads"
public_folder: "/uploads"

collections:

  # =========================================================
  # COMPAGNIE
  # =========================================================

  - name: "compagnie"
    label: "Compagnie"
    label_singular: "Compagnia"
    description: "Archivio delle compagnie teatrali"
    folder: "data/compagnie"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "nome"
    slug: "{{slug}}"
    summary: "{{nome}} — {{citta}}"

    fields:
      - label: "ID"
        name: "id"
        widget: "string"
        hint: "Identificativo univoco. Esempio: i-fatti-in-casa"

      - label: "Nome compagnia"
        name: "nome"
        widget: "string"

      - label: "Città"
        name: "citta"
        widget: "string"
        default: "Roma"

      - label: "Zona"
        name: "zona"
        widget: "string"
        required: false

      - label: "Municipio"
        name: "municipio"
        widget: "select"
        required: false
        options:
          - "I"
          - "II"
          - "III"
          - "IV"
          - "V"
          - "VI"
          - "VII"
          - "VIII"
          - "IX"
          - "X"
          - "XI"
          - "XII"
          - "XIII"
          - "XIV"
          - "XV"

      - label: "Tipologia"
        name: "tipologia"
        widget: "string"
        default: "Compagnia teatrale amatoriale"

      - label: "Generi"
        name: "generi"
        widget: "list"
        required: false
        field:
          label: "Genere"
          name: "genere"
          widget: "string"

      - label: "Descrizione"
        name: "descrizione"
        widget: "text"

      - label: "Logo"
        name: "logo"
        widget: "string"
        required: false
        hint: "Nome del file oppure URL completo dell'immagine"

      - label: "Email"
        name: "email"
        widget: "string"
        required: false

      - label: "Telefono"
        name: "telefono"
        widget: "string"
        required: false

      - label: "Sito web"
        name: "sito"
        widget: "string"
        required: false

      - label: "Facebook"
        name: "facebook"
        widget: "string"
        required: false

      - label: "Instagram"
        name: "instagram"
        widget: "string"
        required: false

      - label: "Compagnia attiva"
        name: "attiva"
        widget: "boolean"
        default: true


  # =========================================================
  # SPETTACOLI
  # =========================================================

  - name: "eventi"
    label: "Spettacoli"
    label_singular: "Spettacolo"
    description: "Spettacoli, corsi, laboratori ed eventi teatrali"
    folder: "data/eventi"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "titolo"
    slug: "{{slug}}"
    summary: "{{titolo}} — {{luogo}}"

    fields:
      - label: "ID"
        name: "id"
        widget: "string"
        hint: "Identificativo univoco. Esempio: rumori-fuori-scena-roma-2026"

      - label: "Titolo"
        name: "titolo"
        widget: "string"

      - label: "Tipo"
        name: "tipo"
        widget: "select"
        default: "spettacolo"
        options:
          - label: "Spettacolo"
            value: "spettacolo"
          - label: "Corso"
            value: "corso"
          - label: "Laboratorio"
            value: "laboratorio"
          - label: "Evento"
            value: "evento"

      - label: "Compagnia"
        name: "compagnia_id"
        widget: "relation"
        collection: "compagnie"
        search_fields:
          - "nome"
        value_field: "id"
        display_fields:
          - "nome"
        required: false
        hint: "Seleziona la compagnia che organizza o produce lo spettacolo"

      - label: "Descrizione"
        name: "descrizione"
        widget: "text"

      - label: "Date e orari"
        name: "date"
        widget: "list"
        summary: "{{fields.data}} — {{fields.ora}}"
        fields:
          - label: "Data"
            name: "data"
            widget: "date"
            format: "YYYY-MM-DD"

          - label: "Ora"
            name: "ora"
            widget: "string"
            hint: "Formato HH:MM, ad esempio 21:00"

      - label: "Luogo"
        name: "luogo"
        widget: "string"

      - label: "Indirizzo"
        name: "indirizzo"
        widget: "string"
        required: false

      - label: "Città"
        name: "citta"
        widget: "string"
        default: "Roma"

      - label: "Quartiere"
        name: "quartiere"
        widget: "string"
        required: false

      - label: "Municipio"
        name: "municipio"
        widget: "select"
        required: false
        options:
          - "I"
          - "II"
          - "III"
          - "IV"
          - "V"
          - "VI"
          - "VII"
          - "VIII"
          - "IX"
          - "X"
          - "XI"
          - "XII"
          - "XIII"
          - "XIV"
          - "XV"

      - label: "Prezzo intero"
        name: "prezzo_intero"
        widget: "string"
        required: false

      - label: "Prezzo ridotto"
        name: "prezzo_ridotto"
        widget: "string"
        required: false

      - label: "Prenotazioni"
        name: "prenotazioni"
        widget: "string"
        required: false

      - label: "Locandina"
        name: "locandina"
        widget: "string"
        required: false
        hint: "Nome del file oppure URL Cloudinary completo"

      - label: "Link"
        name: "link"
        widget: "string"
        required: false

      - label: "Pubblicato"
        name: "pubblicato"
        widget: "boolean"
        default: true


  # =========================================================
  # BACHECA
  # =========================================================

  - name: "annunci"
    label: "Bacheca"
    label_singular: "Annuncio"
    description: "Casting, collaborazioni, sale prova e annunci teatrali"
    folder: "data/annunci"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "titolo"
    slug: "{{slug}}"
    summary: "{{categoria}} — {{titolo}}"

    fields:
      - label: "ID"
        name: "id"
        widget: "string"
        hint: "Identificativo univoco. Esempio: cercasi-attore-roma-ottobre-2026"

      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - "CASTING"
          - "COLLABORAZIONI"
          - "SALE PROVA"
          - "CORSI"
          - "CERCO COMPAGNIA"
          - "TECNICI"
          - "ALTRO"

      - label: "Titolo"
        name: "titolo"
        widget: "string"

      - label: "Descrizione"
        name: "descrizione"
        widget: "text"

      - label: "Compagnia"
        name: "compagnia_id"
        widget: "relation"
        collection: "compagnie"
        search_fields:
          - "nome"
        value_field: "id"
        display_fields:
          - "nome"
        required: false
        hint: "Se l'annuncio è collegato a una compagnia, selezionala qui"

      - label: "Autore"
        name: "autore"
        widget: "string"
        required: false

      - label: "Città"
        name: "citta"
        widget: "string"
        default: "Roma"

      - label: "Zona"
        name: "zona"
        widget: "string"
        required: false

      - label: "Municipio"
        name: "municipio"
        widget: "select"
        required: false
        options:
          - "I"
          - "II"
          - "III"
          - "IV"
          - "V"
          - "VI"
          - "VII"
          - "VIII"
          - "IX"
          - "X"
          - "XI"
          - "XII"
          - "XIII"
          - "XIV"
          - "XV"

      - label: "Data pubblicazione"
        name: "data_pubblicazione"
        widget: "date"
        format: "YYYY-MM-DD"

      - label: "Data scadenza"
        name: "data_scadenza"
        widget: "date"
        format: "YYYY-MM-DD"
        required: false

      - label: "Email"
        name: "email"
        widget: "string"
        required: false

      - label: "Telefono"
        name: "telefono"
        widget: "string"
        required: false

      - label: "Link"
        name: "link"
        widget: "string"
        required: false

      - label: "Pubblicato"
        name: "pubblicato"
        widget: "boolean"
        default: true


  # =========================================================
  # NOTIZIE
  # =========================================================

  - name: "notizie"
    label: "Notizie"
    label_singular: "Notizia"
    description: "Articoli, approfondimenti e storie di Corriere Teatrale"
    folder: "data/notizie"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "titolo"
    slug: "{{slug}}"
    summary: "{{data_pubblicazione}} — {{titolo}}"

    fields:
      - label: "ID"
        name: "id"
        widget: "string"
        hint: "Identificativo univoco. Usa lettere minuscole e trattini. Esempio: teatro-quartieri-roma"

      - label: "Titolo"
        name: "titolo"
        widget: "string"

      - label: "Categoria"
        name: "categoria"
        widget: "select"
        default: "NOTIZIE"
        options:
          - "NOTIZIE"
          - "STORIE"
          - "APPROFONDIMENTI"
          - "DAL PALCOSCENICO"
          - "DIETRO LE QUINTE"
          - "CORSI E FORMAZIONE"

      - label: "Occhiello"
        name: "occhiello"
        widget: "string"
        required: false
        hint: "Una breve frase sopra o accanto al titolo"

      - label: "Sommario"
        name: "sommario"
        widget: "text"
        hint: "Due o tre righe che presentano l'articolo"

      - label: "Testo dell'articolo"
        name: "testo"
        widget: "markdown"

      - label: "Immagine principale"
        name: "immagine"
        widget: "string"
        required: false
        hint: "Nome del file oppure URL completo dell'immagine"

      - label: "Didascalia immagine"
        name: "didascalia"
        widget: "string"
        required: false

      - label: "Autore"
        name: "autore"
        widget: "string"
        default: "Redazione Corriere Teatrale"

      - label: "Data pubblicazione"
        name: "data_pubblicazione"
        widget: "date"
        format: "YYYY-MM-DD"

      - label: "Pubblicato"
        name: "pubblicato"
        widget: "boolean"
        default: true


  # =========================================================
  # INTERVISTE
  # =========================================================

  - name: "interviste"
    label: "Interviste"
    label_singular: "Intervista"
    description: "Le voci e le persone del teatro amatoriale romano"
    folder: "data/interviste"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "titolo"
    slug: "{{slug}}"
    summary: "{{data_pubblicazione}} — {{intervistato}}"

    fields:
      - label: "ID"
        name: "id"
        widget: "string"
        hint: "Identificativo univoco. Esempio: intervista-mario-rossi"

      - label: "Titolo"
        name: "titolo"
        widget: "string"
        hint: "Esempio: Mario Rossi: «Il teatro è prima di tutto incontro»"

      - label: "Intervistato"
        name: "intervistato"
        widget: "string"

      - label: "Ruolo"
        name: "ruolo"
        widget: "string"
        required: false
        hint: "Esempio: attore, regista, autore, presidente di compagnia"

      - label: "Compagnia / realtà"
        name: "compagnia"
        widget: "string"
        required: false

      - label: "Introduzione"
        name: "introduzione"
        widget: "text"
        hint: "Breve presentazione della persona e dell'intervista"

      - label: "Domande e risposte"
        name: "domande"
        widget: "list"
        summary: "{{fields.domanda}}"
        fields:
          - label: "Domanda"
            name: "domanda"
            widget: "string"

          - label: "Risposta"
            name: "risposta"
            widget: "text"

      - label: "Testo conclusivo"
        name: "conclusione"
        widget: "markdown"
        required: false
        hint: "Eventuale chiusura dell'intervista"

      - label: "Immagine principale"
        name: "immagine"
        widget: "string"
        required: false
        hint: "Nome del file oppure URL completo dell'immagine"

      - label: "Didascalia immagine"
        name: "didascalia"
        widget: "string"
        required: false

      - label: "Autore"
        name: "autore"
        widget: "string"
        default: "Redazione Corriere Teatrale"

      - label: "Data pubblicazione"
        name: "data_pubblicazione"
        widget: "date"
        format: "YYYY-MM-DD"

      - label: "Pubblicato"
        name: "pubblicato"
        widget: "boolean"
        default: true
